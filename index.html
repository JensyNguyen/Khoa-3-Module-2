<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Photo Gallery</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Interactive Photo Gallery</h1>
        <p>Move your mouse over an image to see it here.</p>
    </header>
    <main>
        <div id="image">
            Hover over an image below to display here.
        </div>
        <div class="gallery">
            <img
                class="preview"
                src="cat.jpg"
                alt="Cute Cat"
                onmouseover="upDate(this)"
                onmouseout="unDo()"
            >
            <img
                class="preview"
                src="dog.jpg"
                alt="Cute Dog"
                onmouseover="upDate(this)"
                onmouseout="unDo()"
            >
            <img
                class="preview"
                src="hamster.jpg"
                alt="Cute Hamster"
                onmouseover="upDate(this)"
                onmouseout="unDo()"
            >
        </div>
    </main>
</body>
</html>
